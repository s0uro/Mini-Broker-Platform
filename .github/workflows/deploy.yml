name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Frontend ----
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend – install, lint, build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      # ---- Backend ----
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Backend – test
        run: dotnet test MiniBroker.slnx -c Release

      - name: Backend – publish (with the frontend in wwwroot)
        run: |
          dotnet publish src/MiniBroker.Api/MiniBroker.Api.csproj -c Release -o publish
          mkdir -p publish/wwwroot
          cp -r frontend/dist/. publish/wwwroot/

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
